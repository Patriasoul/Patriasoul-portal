name: Fix homepage live modules
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Fix homepage live modules' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore live module script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/js/homepage-live.js?v=2"></script>'
          if tag not in s:
              s=s.replace('<script src="assets/js/portal.js?v=7"></script>', tag+'<script src="assets/js/portal.js?v=7"></script>')
              p.write_text(s,encoding='utf-8')
          css=Path('assets/css/portal.css')
          c=css.read_text(encoding='utf-8')
          rule='.breaking-ticker{flex:1;overflow:hidden;white-space:nowrap}.breaking-ticker>div{display:inline-flex;align-items:center;gap:14px;min-width:max-content;animation:patriaTicker 42s linear infinite}.breaking-ticker:hover>div{animation-play-state:paused}.breaking-ticker a{font-weight:800;color:var(--red)}.breaking-sep{color:var(--muted);padding:0 3px}@keyframes patriaTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}'
          if '.breaking-ticker{' not in c:
              c += '\n'+rule+'\n'
              css.write_text(c,encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "PatriaSoul Bot"
          git config user.email "patriasoul@users.noreply.github.com"
          git add index.html assets/css/portal.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix homepage live modules"
          git push
