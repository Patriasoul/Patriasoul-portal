name: Repair missing article photographs

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-missing-article-images.js
      - .github/workflows/repair-missing-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair missing images
        run: node scripts/fix-missing-article-images.js
      - name: Commit repaired images
        run: |
          git config user.name "PatriaSoul Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/content-data.js assets/images/articles clanak-*.html
          if git diff --cached --quiet; then
            echo "No image repairs needed."
            exit 0
          fi
          git commit -m "Add unique images to all article pages"
          git push
