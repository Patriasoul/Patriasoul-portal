name: PatriaSoul · AI napiši članak

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema članka"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-ai-article:
    if: github.ref == 'refs/heads/content-engine-v1'
    runs-on: ubuntu-latest
    env:
      OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
      TOPIC: ${{ inputs.topic }}
      OPENAI_MODEL: gpt-5
      OUTPUT: content-engine/ai-article.json
    steps:
      - name: Preuzmi portal
        uses: actions/checkout@v4

      - name: Provjeri OpenAI ključ
        run: |
          test -n "$OPEN_AI_API_KEY" || (echo "OPEN_AI_API_KEY nije postavljen u GitHub Secrets." && exit 1)
          echo "✓ OPEN_AI_API_KEY pronađen"

      - name: Generiraj članak uz OpenAI
        run: |
          node content-engine/generate-ai-article.js
          echo "✓ OpenAI poziv i generiranje uspješni"

      - name: Učitaj AI članak u red za uredničku provjeru
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ai = JSON.parse(fs.readFileSync('content-engine/ai-article.json','utf8'));
          const queuePath = 'content-engine/content-queue.json';
          const queue = JSON.parse(fs.readFileSync(queuePath,'utf8'));
          queue.articles = queue.articles || [];
          const slug = (ai.slug || ai.title)
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g,'')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g,'-')
            .replace(/^-+|-+$/g,'')
            .slice(0,80);
          ai.slug = slug || 'ai-clanak-' + Date.now();
          queue.articles = queue.articles.filter(a => a.slug !== ai.slug);
          queue.articles.push(ai);
          fs.writeFileSync(queuePath, JSON.stringify(queue, null, 2) + '\n');
          console.log('✓ Članak stavljen u content-queue.json');
          NODE

      - name: Validiraj i generiraj pregledni HTML
        run: |
          node content-engine/generate-article.js content-engine/content-queue.json content-engine/generated
          echo "✓ Validator prošao"
          echo "✓ HTML generiran"
          test -f content-engine/generated/manifest.json
          echo "✓ Manifest generiran"

      - name: Spremi promjene
        run: |
          git config user.name "PatriaSoul Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-engine/content-queue.json content-engine/generated content-engine/ai-article.json
          git diff --cached --quiet && exit 0
          git commit -m "content-engine: OpenAI pripremio članak za uredničku provjeru"
          git push
