<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Najnovije objavljene priče PatriaSoula — povijest, vjera, domovina, obitelj, baština i ljudi."><title>Najnovije · PatriaSoul</title><link rel="stylesheet" href="assets/css/portal.css?v=4"><link rel="stylesheet" href="assets/css/portal-core.css?v=2"></head><body><header class="site-header"></header><main class="container"><section class="page-head"><span class="kicker">AKTUALNO</span><h1>Najnovije priče</h1><p>Središnji tok objavljenih priča, automatski sortiran prema datumu u uredničkom registru.</p></section><div class="portal-core-toolbar"><select id="latest-category" aria-label="Filtriraj rubriku"><option value="">Sve rubrike</option></select><span id="latest-count" class="portal-core-count"></span></div><div class="news-grid"><div class="news-list" id="latest-list"></div><aside class="weather-module"><div class="module-title"><h2>Vrijeme u Hrvatskoj</h2></div><p class="muted">Trenutna temperatura prema Open-Meteo podacima. Vrijednosti se osvježavaju pri učitavanju stranice.</p><div class="weather-cities" id="latest-weather"><span>Zagreb <b>…</b></span><span>Split <b>…</b></span><span>Rijeka <b>…</b></span><span>Osijek <b>…</b></span><span>Pula <b>…</b></span><span>Zadar <b>…</b></span></div></aside></div></main><footer class="site-footer"></footer><script src="assets/js/content-data.js?v=12"></script><script src="assets/js/article-system.js?v=2"></script><script src="assets/js/portal.js?v=11"></script><script>
(()=>{const p=window.PatriaSoulPortal;if(!p)return;const list=document.getElementById('latest-list'),sel=document.getElementById('latest-category'),count=document.getElementById('latest-count');const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));p.categories.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)});function render(){const rows=p.articles.filter(a=>!sel.value||a.category===sel.value).sort((a,b)=>(b.date||'').localeCompare(a.date||''));count.textContent=rows.length+' priča';list.innerHTML=rows.map(a=>'<article class="news-row"><a class="thumb thumb-link" href="'+esc(a.url)+'"><img src="'+esc(a.image||'')+'" alt="'+esc(a.imageAlt||a.title)+'" loading="lazy" width="800" height="530"></a><div><span class="section-label">'+esc(a.rubric||a.category)+' · '+esc(a.category)+'</span><h3><a href="'+esc(a.url)+'">'+esc(a.title)+'</a></h3><p>'+esc(a.deck)+'</p><small>'+esc(a.meta||a.date||'')+'</small></div></article>').join('')||'<p>Nema objavljenih priča.</p>'}sel.addEventListener('change',render);render();
const cities=[['Zagreb',45.815,15.982],['Split',43.508,16.440],['Rijeka',45.327,14.442],['Osijek',45.555,18.695],['Pula',44.867,13.849],['Zadar',44.119,15.232]],box=document.getElementById('latest-weather');Promise.all(cities.map(c=>fetch('https://api.open-meteo.com/v1/forecast?latitude='+c[1]+'&longitude='+c[2]+'&current=temperature_2m&timezone=Europe%2FZagreb').then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>[c[0],Math.round(j.current.temperature_2m)]).catch(()=>[c[0],null]))).then(rows=>{box.innerHTML='';rows.forEach(r=>{const s=document.createElement('span'),b=document.createElement('b');b.textContent=r[1]===null?'—':r[1]+' °C';s.append(r[0]+' ',b);box.appendChild(s)})});})();
</script></body></html>
