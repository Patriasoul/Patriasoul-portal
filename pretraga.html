<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Pretražite priče, stranice, ljude, mjesta, teme i oznake na cijelom portalu PatriaSoul."><title>Pretraga · PatriaSoul</title><link rel="stylesheet" href="assets/css/portal.css"><link rel="stylesheet" href="assets/css/portal-core.css"></head><body><header class="site-header"></header><main class="container"><section class="page-head"><span class="kicker">PRETRAGA</span><h1>Pretražite PatriaSoul</h1><p>Pretražite objavljene priče po naslovu, temi, mjestu, razdoblju, rubrici i oznakama.</p></section><div class="portal-core-toolbar"><input id="search-input" type="search" placeholder="Npr. Vukovar, vjera, Penkala, baština…" aria-label="Pretraga PatriaSoula"><select id="search-category" aria-label="Filtriraj rubriku"><option value="">Sve rubrike</option></select><select id="search-type" aria-label="Filtriraj vrstu priče"><option value="">Sve vrste</option></select><span id="search-count" class="portal-core-count"></span></div><section id="search-results" class="core-card-grid" aria-live="polite"></section></main><footer class="site-footer"></footer><script src="assets/js/content-data.js?v=7"></script><script src="assets/js/article-system.js?v=1"></script><script src="assets/js/portal.js?v=core1"></script><script>
(()=>{const p=window.PatriaSoulPortal;if(!p)return;const input=document.getElementById('search-input'),cat=document.getElementById('search-category'),type=document.getElementById('search-type'),grid=document.getElementById('search-results'),count=document.getElementById('search-count');const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));p.categories.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;cat.appendChild(o)});[...new Set(p.articles.map(a=>a.type).filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;type.appendChild(o)});
function render(){let list=p.find(input.value).filter(a=>(!cat.value||a.category===cat.value)&&(!type.value||a.type===type.value));count.textContent=list.length+' '+(list.length===1?'priča':'priča');grid.innerHTML=list.map(a=>'<a class="core-card" href="'+esc(a.url)+'"><img src="'+esc(a.image||'')+'" alt="'+esc(a.imageAlt||a.title)+'" loading="lazy" width="800" height="530"><span class="core-card-body"><span class="core-card-label">'+esc(a.rubric||a.category)+'</span><h3>'+esc(a.title)+'</h3><p>'+esc(a.deck)+'</p><small class="core-card-meta">'+esc(a.place||'')+(a.place&&a.date?' · ':'')+esc(a.date||'')+'</small></span></a>').join('')||'<p>Nema pronađenih objavljenih priča.</p>'}
[input,cat,type].forEach(el=>el.addEventListener(el===input?'input':'change',render));const q=new URLSearchParams(location.search).get('q');if(q){input.value=q}render()})();
</script></body></html>
